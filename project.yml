name: SmartGroceryReminder
options:
  bundleIdPrefix: com.smartgrocery
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  TARGETED_DEVICE_FAMILY: "1"
  SWIFT_VERSION: "5.0"
targets:
  SmartGroceryReminder:
    type: application
    platform: iOS
    sources:
      - path: SmartGroceryReminder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.smartgrocery.reminder
      INFOPLIST_FILE: SmartGroceryReminder/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    scheme:
      testTargets:
        - SmartGroceryReminderTests
      gatherCoverageData: true
  SmartGroceryReminderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SmartGroceryReminderTests
    dependencies:
      - target: SmartGroceryReminder
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.smartgrocery.reminder.tests
      GENERATE_INFOPLIST_FILE: true
