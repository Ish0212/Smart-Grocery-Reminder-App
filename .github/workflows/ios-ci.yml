name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Pick an eligible iPhone simulator
        id: sim
        run: |
          # -showdestinations lists only simulators this Xcode can run the scheme on.
          find_sim() {
            xcodebuild -showdestinations -project SmartGroceryReminder.xcodeproj -scheme SmartGroceryReminder 2>&1 \
              | tee /dev/stderr | grep -m1 'platform:iOS Simulator.*name:iPhone' || true
          }
          LINE=$(find_sim)
          if [ -z "$LINE" ]; then
            echo "No iPhone simulator for this Xcode; downloading the iOS platform..."
            xcodebuild -downloadPlatform iOS
            LINE=$(find_sim)
          fi
          echo "Using simulator: $LINE"
          UDID=$(echo "$LINE" | sed -E 's/.*id:([^,]+),.*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartGroceryReminder.xcodeproj \
            -scheme SmartGroceryReminder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Results.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build test

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Results.xcresult
