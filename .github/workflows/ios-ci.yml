name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      device_ipa:
        description: Build an .ipa for sideloading onto an iPhone (ad-hoc signed, skips the tests)
        type: boolean
        default: false

# A device build must not cancel the test run for the same commit, and main's test runs are never
# cancelled; only a newer push to a pull request replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.device_ipa || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    if: ${{ !inputs.device_ipa }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Use the runner's default Xcode: it ships with simulator runtimes and devices preinstalled.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      # Firebase and its dependencies are large; keep the resolved package checkouts between runs.
      # project.yml pins Firebase exactly, so the key changes with the pin. Package.resolved can't key it:
      # it lives in the generated, gitignored .xcodeproj. Bump the v2 prefix to start from an empty cache.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-v2-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Pick an eligible iPhone simulator
        id: sim
        run: |
          # -showdestinations lists only simulators this Xcode can run the scheme on.
          find_sim() {
            xcodebuild -showdestinations -project SmartGroceryReminder.xcodeproj -scheme SmartGroceryReminder \
              -clonedSourcePackagesDirPath .spm 2>&1 \
              | tee /dev/stderr | grep -m1 'platform:iOS Simulator.*name:iPhone' || true
          }
          # The runner's default Xcode may not match the installed simulator runtimes,
          # so try each installed Xcode (newest first) until one lists an iPhone simulator.
          LINE=""
          for XC in $(ls -d /Applications/Xcode_*.app | sort -rV); do
            sudo xcode-select -s "$XC"
            echo "Trying $XC"
            LINE=$(find_sim)
            [ -n "$LINE" ] && break
          done
          if [ -z "$LINE" ]; then
            # Runtime present but no devices: create one using a device type the newest iOS runtime supports.
            read -r DEVTYPE RUNTIME < <(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS"]
          rt = rts[-1]
          dt = [d for d in rt["supportedDeviceTypes"] if d["productFamily"] == "iPhone"][-1]
          print(dt["identifier"], rt["identifier"])
          ')
            echo "Creating simulator: $DEVTYPE on $RUNTIME"
            xcrun simctl create "CI iPhone" "$DEVTYPE" "$RUNTIME"
            LINE=$(find_sim)
          fi
          xcodebuild -version
          echo "Using simulator: $LINE"
          UDID=$(echo "$LINE" | sed -E 's/.*id:([^,]+),.*/\1/')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartGroceryReminder.xcodeproj \
            -scheme SmartGroceryReminder \
            -clonedSourcePackagesDirPath .spm \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/Results.xcresult \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            build test

      # App Store Connect rejects uploads without a privacy manifest; make sure it lands in the bundle.
      - name: Check privacy manifest is bundled
        run: plutil -lint build/DerivedData/Build/Products/Debug-iphonesimulator/SmartGroceryReminder.app/PrivacyInfo.xcprivacy

      - name: Check the widget is embedded
        run: plutil -lint build/DerivedData/Build/Products/Debug-iphonesimulator/SmartGroceryReminder.app/PlugIns/SmartGroceryWidget.appex/Info.plist

      # The asset catalog compiler adds CFBundleIcons only when it built the AppIcon set; App Store Connect rejects an app without an icon.
      - name: Check the app icon is compiled
        run: |
          ICON=$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw -o - build/DerivedData/Build/Products/Debug-iphonesimulator/SmartGroceryReminder.app/Info.plist)
          echo "App icon: $ICON"
          test "$ICON" = AppIcon

      # Both Info.plists read MARKETING_VERSION / CURRENT_PROJECT_VERSION from project.yml; they must be set and equal.
      - name: Check the app and widget versions match
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphonesimulator/SmartGroceryReminder.app
          for KEY in CFBundleShortVersionString CFBundleVersion; do
            A=$(plutil -extract $KEY raw -o - "$APP/Info.plist")
            W=$(plutil -extract $KEY raw -o - "$APP/PlugIns/SmartGroceryWidget.appex/Info.plist")
            echo "$KEY: app $A, widget $W"
            grep -Eq '^[0-9]+(\.[0-9]+)*$' <<< "$A"
            test "$A" = "$W"
          done

      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Results.xcresult

  # Run from the Actions tab (or `gh workflow run ios-ci.yml --ref <branch> -f device_ipa=true`).
  # The .ipa is only ad-hoc signed (to carry the entitlements); Sideloadly signs it with your Apple ID
  # when installing (see README). The file and artifact keep their "unsigned" names so the docs' commands still work.
  device-ipa:
    if: ${{ inputs.device_ipa }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Device builds don't need simulator runtimes; the newest Xcode meets Firebase's 26.2+ minimum.
      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -rV | head -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-v2-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild             -project SmartGroceryReminder.xcodeproj             -scheme SmartGroceryReminder             -configuration Release             -destination 'generic/platform=iOS'             -clonedSourcePackagesDirPath .spm             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build

      # An unsigned build carries no entitlements, so the App Group would never be requested. Ad-hoc sign
      # inside out (frameworks, widget, app) with each target's entitlements; Sideloadly keeps them when re-signing.
      - name: Sign with the entitlements (ad hoc)
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/SmartGroceryReminder.app
          WIDGET="$APP/PlugIns/SmartGroceryWidget.appex"
          test -d "$WIDGET"
          shopt -s nullglob
          for FW in "$APP"/Frameworks/*.framework "$APP"/Frameworks/*.dylib; do
            codesign --force --sign - "$FW"
          done
          codesign --force --sign - --entitlements SmartGroceryWidget/SmartGroceryWidget.entitlements "$WIDGET"
          codesign --force --sign - --entitlements SmartGroceryReminder/SmartGroceryReminder.entitlements "$APP"
          for BUNDLE in "$WIDGET" "$APP"; do
            ENTITLEMENTS=$(codesign -d --entitlements - "$BUNDLE" 2>&1)
            echo "$ENTITLEMENTS"
            grep -q 'group.com.smartgrocery.reminder' <<< "$ENTITLEMENTS"
          done

      - name: Package .ipa
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/SmartGroceryReminder.app
          test -d "$APP"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PlugIns/SmartGroceryWidget.appex/Info.plist"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../SmartGroceryReminder-unsigned.ipa Payload)
          ls -lh build/SmartGroceryReminder-unsigned.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: SmartGroceryReminder-unsigned-ipa
          path: build/SmartGroceryReminder-unsigned.ipa
          retention-days: 14
