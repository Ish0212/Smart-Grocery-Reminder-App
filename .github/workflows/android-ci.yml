name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Gradle and caches the Gradle home between runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # The runner image has the Android SDK; this makes sure the compile platform is installed.
      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build, test and lint
        run: gradle assembleDebug testDebugUnitTest lint --no-daemon

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-grocery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
