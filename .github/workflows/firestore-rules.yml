name: Firestore rules

# Runs the security rules tests against the Firestore emulator on Linux (cheaper than macOS minutes).
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firebase.json
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

concurrency:
  group: firestore-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firestore-tests/package-lock.json') }}

      - run: npm ci

      - run: npm test
